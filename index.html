<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Halvmarathon"/>
<title>Halvmarathon 23. maj</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0b1117;font-family:'Outfit',sans-serif;color:#fff;max-width:430px;margin:0 auto;min-height:100vh}
button{cursor:pointer;font-family:'Outfit',sans-serif}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(0.6);cursor:pointer}

.hero{background:linear-gradient(160deg,#0b1117 0%,#102030 60%,#0f2a1a 100%);padding:52px 20px 24px;position:relative;overflow:hidden}
.hero-ring{position:absolute;top:-60px;right:-60px;width:220px;height:220px;border-radius:50%;border:1.5px solid rgba(255,215,0,0.09);pointer-events:none}
.eyebrow{font-size:9px;letter-spacing:4px;text-transform:uppercase;color:rgba(255,215,0,0.5);font-weight:600;margin-bottom:5px}
.h1{font-family:'Archivo Black',sans-serif;font-size:36px;line-height:1;margin-bottom:2px}
.h2{font-family:'Archivo Black',sans-serif;font-size:21px;color:#ffd700;margin-bottom:8px}
.goal{display:inline-flex;align-items:center;gap:7px;background:rgba(255,215,0,0.07);border:1px solid rgba(255,215,0,0.18);border-radius:30px;padding:5px 12px;margin-bottom:18px;font-size:11px;color:#ffd700;font-weight:600}
.stats{display:flex;gap:8px;margin-bottom:18px}
.stat{flex:1;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:10px 6px;text-align:center}
.stat-v{font-family:'Archivo Black',sans-serif;font-size:20px;color:#ffd700;line-height:1}
.stat-v.blue{color:#4da6ff;font-size:13px}
.stat-l{font-size:9px;color:#334;margin-top:3px;text-transform:uppercase;letter-spacing:0.8px}
.prog-row{display:flex;justify-content:space-between;margin-bottom:5px;font-size:11px;color:#334}
.prog-pct{color:#50dc64;font-weight:600}
.prog-track{height:7px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#4da6ff,#50dc64);border-radius:4px;transition:width 0.5s}

.nav-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,193,7,0.1);border:1px solid rgba(255,193,7,0.25);border-radius:20px;padding:7px 14px;color:#ffd700;font-weight:700;font-size:12px;margin:12px 13px 0;float:right}

.weeks{padding:12px 13px 4px;clear:both}

.week{border-radius:22px;margin-bottom:12px;overflow:hidden;border:2px solid rgba(255,255,255,0.05);background:linear-gradient(135deg,#131a22,#1c2733);transition:border-color 0.2s}
.week.open{border-color:rgba(255,255,255,0.15)}
.week.race{background:linear-gradient(135deg,#1a1000,#2d1f00)}
.week.race.open{border-color:#ffd700}
.week-hdr{padding:15px 17px;display:flex;align-items:center;gap:13px;cursor:pointer;user-select:none}
.wlabel{font-family:'Archivo Black',sans-serif;font-size:17px;color:#fff}
.race .wlabel{color:#ffd700}
.wdates{font-size:10px;color:#3a4a5a;background:rgba(255,255,255,0.05);padding:2px 7px;border-radius:20px}
.wtheme{font-size:12px;color:#8a9bb0;margin-top:1px}
.race .wtheme{color:#ffaa00}
.wkm{font-family:'Archivo Black',sans-serif;font-size:24px;color:#fff;line-height:1;text-align:right}
.race .wkm{color:#ffd700}
.wkm-lbl{font-size:10px;color:#445;text-align:right}
.runs{display:none;padding:0 13px 13px}
.runs.open{display:block}
.divider{height:1px;background:rgba(255,255,255,0.06);margin-bottom:11px}

.run{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:14px;margin-bottom:8px;border:1.5px solid rgba(255,255,255,0.07);background:rgba(255,255,255,0.04);transition:all 0.2s}
.run.done{border-color:rgba(80,220,100,0.3);background:rgba(80,220,100,0.04)}
.run.race-run{border-color:rgba(255,215,0,0.25)}
.chk{width:30px;height:30px;border-radius:9px;flex-shrink:0;border:2px solid rgba(255,255,255,0.18);background:transparent;display:flex;align-items:center;justify-content:center;font-size:16px;color:rgba(255,255,255,0.25);transition:all 0.2s;padding:0}
.chk.done{background:#50dc64;border:none;color:#fff;font-size:15px}
.run-info{flex:1;min-width:0}
.run-top{display:flex;justify-content:space-between;align-items:baseline}
.run-day{font-weight:700;font-size:14px;color:#fff}
.run.done .run-day{color:#888;text-decoration:line-through}
.run-date{font-size:11px;color:#3a4a5a;margin-left:5px}
.run-km{font-family:'Archivo Black',sans-serif;font-size:20px;color:#fff}
.run-km.gold{color:#ffd700}
.run-km.green{color:#50dc64}
.km-unit{font-size:11px;color:#445;margin-left:2px}
.run-diff{font-size:10px}
.run-mid{display:flex;justify-content:space-between;align-items:center;margin-top:5px;gap:4px}
.type-badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;padding:2px 8px;border-radius:20px;flex-shrink:0}
.pace-wrap{display:flex;gap:5px;align-items:center}
.pace-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;background:rgba(77,166,255,0.08);color:#5b8aaa}
.pace-badge.gold{background:rgba(255,215,0,0.08);color:#ffd700}
.est{font-size:10px;color:#334}
.run-bot{margin-top:3px;font-size:11px;color:#334}
.run-logged{margin-top:4px;font-size:11px;color:#4aaa6a}
.edit-link{font-size:10px;color:#445;background:none;border:none;text-decoration:underline;padding:0;margin-left:6px;cursor:pointer}

.legend{background:linear-gradient(135deg,#131a22,#1c2733);border-radius:20px;padding:14px 15px;border:1.5px solid rgba(255,255,255,0.05);margin:0 13px 4px}
.legend-title{font-family:'Archivo Black',sans-serif;font-size:13px;color:#fff;margin-bottom:10px}
.legend-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.legend-item{display:flex;gap:7px;align-items:flex-start;background:rgba(255,255,255,0.03);border-radius:9px;padding:7px 9px}
.legend-name{font-size:11px;font-weight:700;color:#bbb}
.legend-desc{font-size:10px;color:#334}

.iv-section{padding:12px 13px 40px}
.iv-header{background:linear-gradient(135deg,#1a1000,#2d2000);border-radius:20px;padding:16px 18px;border:1.5px solid rgba(255,193,7,0.2);margin-bottom:12px}
.iv-eyebrow{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,215,0,0.5);font-weight:600;margin-bottom:3px}
.iv-title{font-family:'Archivo Black',sans-serif;font-size:20px;color:#fff;margin-bottom:5px}
.iv-desc{font-size:12px;color:#8a9bb0;line-height:1.5}
.iv-card{background:linear-gradient(135deg,#131a22,#1c2733);border-radius:16px;margin-bottom:10px;border:1.5px solid rgba(255,255,255,0.06);padding:13px 14px}
.iv-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.iv-badge{width:32px;height:32px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Archivo Black',sans-serif;font-size:15px}
.iv-label{font-family:'Archivo Black',sans-serif;font-size:16px;color:#fff}
.iv-pills{display:flex;gap:7px;margin-bottom:10px}
.iv-pill{flex:1;background:rgba(255,255,255,0.05);border-radius:10px;padding:8px 10px;border:1px solid rgba(255,255,255,0.06)}
.iv-pill-lbl{font-size:9px;color:#556;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:2px}
.iv-pill-val{font-family:'Archivo Black',sans-serif;font-size:13px;color:#fff}
.iv-pill-val.blue{color:#4da6ff}
.iv-tip{background:rgba(255,255,255,0.03);border-radius:9px;padding:8px 10px;font-size:11px;color:#8a9bb0;line-height:1.5}
.husk{background:linear-gradient(135deg,#1a1000,#2d1f00);border-radius:16px;padding:14px;border:1.5px solid rgba(255,215,0,0.2);margin-bottom:12px}
.husk-title{font-family:'Archivo Black',sans-serif;font-size:13px;color:#ffd700;margin-bottom:8px}
.husk-item{display:flex;gap:8px;align-items:flex-start;margin-bottom:7px;font-size:12px;color:#ccc;line-height:1.5}
.husk-item:last-child{margin-bottom:0}
.back-btn{display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:12px;color:#aaa;font-weight:700;font-size:12px;width:100%}

.overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.75);display:flex;align-items:flex-end;justify-content:center}
.modal{background:#1c2733;border-radius:24px 24px 0 0;padding:28px 22px 44px;width:100%;max-width:430px;border:1.5px solid rgba(255,255,255,0.1)}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-title{font-family:'Archivo Black',sans-serif;font-size:18px;color:#fff}
.modal-close{background:rgba(255,255,255,0.08);border:none;border-radius:10px;color:#aaa;font-size:20px;width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.form-lbl{font-size:11px;color:#8a9bb0;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px;display:block}
.km-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.km-input{flex:1;background:rgba(255,255,255,0.07);border:1.5px solid rgba(255,255,255,0.15);border-radius:14px;padding:12px;color:#fff;font-size:26px;font-family:'Archivo Black',sans-serif;outline:none;text-align:center;width:100%}
.km-unit-lbl{color:#8a9bb0;font-size:16px;font-weight:600}
.km-diff{text-align:center;font-size:13px;font-weight:600;min-height:20px;margin-bottom:10px}
.date-input{width:100%;background:rgba(255,255,255,0.07);border:1.5px solid rgba(255,255,255,0.15);border-radius:14px;padding:12px 14px;color:#fff;font-size:15px;outline:none;color-scheme:dark;margin-bottom:22px}
.btn-row{display:flex;gap:8px}
.btn-cancel{flex:1;padding:13px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);background:transparent;color:#aaa;font-size:14px}
.btn-save{flex:2;padding:13px;border-radius:12px;border:none;background:#50dc64;color:#fff;font-size:14px;font-family:'Archivo Black',sans-serif}
</style>
</head>
<body>

</div>
